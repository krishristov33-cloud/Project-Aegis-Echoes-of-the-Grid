<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Project Aegis: Echoes of the Grid</title>
<style>
:root{--bg:#05070c;--cyan:#3df0ff;--mag:#ff3d8a;--gold:#ffd166;--txt:#d6f7ff;--dim:#7aa0ae;--panel:rgba(6,10,18,.72);--line:rgba(61,240,255,.28);
  --f:"Bahnschrift","DIN Alternate","Segoe UI",system-ui,sans-serif;--mono:ui-monospace,"Cascadia Mono",Consolas,Menlo,monospace}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--txt);font-family:var(--f);user-select:none;-webkit-font-smoothing:antialiased}
canvas#gl{display:block;position:fixed;inset:0;width:100%;height:100%}
.hidden{display:none!important}
kbd{display:inline-block;min-width:20px;text-align:center;background:var(--txt);color:#041018;padding:0 6px;font:700 11px/18px var(--f);letter-spacing:.04em;border-radius:2px;margin:0 2px;box-shadow:0 2px 0 #0008}
#vign{position:fixed;inset:0;pointer-events:none;z-index:3;background:radial-gradient(ellipse at center,transparent 52%,rgba(4,8,16,.5) 100%)}
#err{display:none;position:fixed;left:12px;right:12px;bottom:12px;z-index:60;background:#2a0008;color:#fff;padding:12px;border-left:3px solid var(--mag);white-space:pre-wrap;font:13px/1.4 var(--mono)}

/* ---------- loading ---------- */
#loading{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;gap:18px;align-items:center;justify-content:center;background:#05070c;font:700 15px var(--f);letter-spacing:.5em;color:var(--cyan);text-indent:.5em}
#loading::after{content:"";width:180px;height:2px;background:linear-gradient(90deg,transparent,var(--cyan),transparent);background-size:60% 100%;background-repeat:no-repeat;animation:loadSweep 1.1s linear infinite}
@keyframes loadSweep{from{background-position:-120% 0}to{background-position:220% 0}}

/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;pointer-events:none;z-index:5;transition:opacity .35s}
#hud.dim{opacity:0}
#hud-chrome{position:absolute;inset:0;pointer-events:none}
#hud-debug{position:absolute;left:14px;top:96px;margin:0;font:600 11px/1.45 var(--mono);background:var(--panel);padding:8px 10px;border-left:2px solid var(--cyan);letter-spacing:.04em;min-width:190px;opacity:.85}

/* objective, top left */
#hud-obj{position:absolute;left:24px;top:22px;max-width:calc(20vw + 56px);padding-left:12px;border-left:2px solid var(--cyan);text-shadow:0 1px 6px #000c;transition:opacity .4s,transform .4s}
#hud-obj.off{opacity:0;transform:translateX(-10px)}
#hud-obj .obj-label{font:700 10px/1 var(--f);letter-spacing:.34em;color:var(--cyan);margin-bottom:7px}
#hud-obj .obj-text{font:600 15px/1.3 var(--f);letter-spacing:.03em;color:var(--txt)}
#hud-obj.pop .obj-text{animation:objPop .5s ease-out}
@keyframes objPop{from{color:var(--cyan);transform:translateX(8px);opacity:.2}to{color:var(--txt);transform:none;opacity:1}}

/* level banner */
#hud-banner{position:absolute;top:17%;left:50%;transform:translateX(-50%);text-align:center;min-width:320px;animation:bannerIn .6s cubic-bezier(.2,.8,.2,1)}
#hud-banner .banner-pre{font:700 11px/1.2 var(--f);letter-spacing:.5em;text-indent:.5em;color:var(--mag);margin-bottom:10px}
#hud-banner .banner-main{font:700 34px/1.05 var(--f);letter-spacing:.24em;text-indent:.24em;color:#fff;text-shadow:0 0 22px #3df0ff88,0 2px 10px #000;white-space:nowrap}
#hud-banner .banner-main::after{content:"";display:block;margin:12px auto 0;width:100%;height:1px;background:linear-gradient(90deg,transparent,var(--cyan),transparent)}
@keyframes bannerIn{from{opacity:0;filter:blur(6px)}to{opacity:1;filter:none}}

/* health = mix meter, bottom left */
#hud-hp{position:absolute;left:24px;bottom:26px;width:280px}
#hud-hp .hp-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:7px;text-shadow:0 1px 6px #000c}
#hud-hp .hp-label{font:700 10px/1 var(--f);letter-spacing:.34em;color:var(--cyan)}
#hud-hp .hp-val{font:700 13px/1 var(--mono);color:var(--txt)}
#hud-hp .hp-track{position:relative;height:12px;background:rgba(6,12,20,.78);border:1px solid var(--line);transform:skewX(-14deg);overflow:hidden}
#hud-hp .hp-ghost,#hud-hp .hp-fill{position:absolute;inset:0;transform-origin:0 50%;will-change:transform}
#hud-hp .hp-ghost{background:#fff;opacity:.55;transition:transform .5s .25s ease-out}
#hud-hp .hp-fill{background:linear-gradient(90deg,#16a3b4,var(--cyan));box-shadow:0 0 12px #3df0ffaa;transition:transform .1s linear}
#hud-hp .hp-track::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 13px,#04101888 13px 14px)}
#hud-hp.low .hp-fill{background:linear-gradient(90deg,#8a1038,var(--mag));box-shadow:0 0 12px #ff3d8aaa}
#hud-hp.low .hp-label{color:var(--mag)}
#hud-hp.low .hp-track{border-color:#ff3d8a66;animation:hpLow .69s ease-in-out infinite}
@keyframes hpLow{50%{box-shadow:0 0 16px #ff3d8a88}}
#hud-hp.hit{animation:hpHit .28s}
@keyframes hpHit{20%{transform:translate(5px,-2px)}50%{transform:translate(-4px,1px)}}

/* powers, bottom centre */
#hud-powers{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);display:flex;gap:10px}
.pw{position:relative;width:54px;height:54px;--cd:0}
.pw .pw-box{position:absolute;inset:0;background:rgba(6,12,20,.78);border:1px solid var(--line);transform:skewX(-8deg);overflow:hidden}
.pw .pw-sweep{position:absolute;inset:0;background:var(--cyan);opacity:.16;transform-origin:50% 100%;transform:scaleY(calc(1 - var(--cd)));will-change:transform}
.pw svg{position:absolute;left:13px;top:8px;width:28px;height:28px;stroke:var(--cyan);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 4px #3df0ff88)}
.pw .pw-name{position:absolute;left:0;right:0;bottom:5px;text-align:center;font:700 8px/1 var(--f);letter-spacing:.16em;text-indent:.16em;color:var(--dim)}
.pw .pw-key{position:absolute;left:50%;top:-9px;transform:translateX(-50%);min-width:18px;padding:0 4px;text-align:center;background:var(--txt);color:#041018;font:700 10px/15px var(--f);border-radius:2px}
.pw.cd svg{stroke:var(--dim);opacity:.45;filter:none}
.pw.cd .pw-key{background:var(--dim)}
.pw.cd .pw-box{border-color:rgba(122,160,174,.25)}
.pw.ready .pw-box{animation:pwReady .45s ease-out}
@keyframes pwReady{0%{box-shadow:0 0 0 0 #3df0ff,inset 0 0 18px #3df0ff;border-color:#fff}100%{box-shadow:0 0 0 12px transparent,inset 0 0 0 transparent}}

/* tempo ring, bottom right */
#hud-tempo{position:absolute;right:24px;bottom:20px;width:84px;height:84px;transform:scale(var(--pulse-scale,1));transform-origin:center;--pulse-scale:1}
#hud-tempo svg{width:84px;height:84px;display:block;filter:drop-shadow(0 0 8px #3df0ff55)}
#hud-tempo .ring-track{fill:rgba(6,12,20,.6);stroke:rgba(61,240,255,.18);stroke-width:5}
#hud-tempo .ring-phase{fill:none;stroke:var(--cyan);stroke-width:5;stroke-linecap:butt;transform:rotate(-90deg);transform-origin:50% 50%}
#hud-tempo .ring-pulse{fill:none;stroke:var(--mag);stroke-width:2}
#hud-tempo .ring-win{fill:none;stroke:var(--gold);stroke-width:5;opacity:.9;transform-origin:50% 50%}
#hud-tempo .tempo-bpm{position:absolute;inset:0 0 14px;display:flex;align-items:center;justify-content:center;font:700 20px/1 var(--f);color:var(--txt);text-shadow:0 0 8px #012}
#hud-tempo .tempo-label{position:absolute;left:0;right:0;bottom:22px;text-align:center;font:700 8px/1 var(--f);letter-spacing:.24em;text-indent:.24em;color:var(--cyan)}
#hud-tempo.on-beat .tempo-bpm{color:var(--gold)}

/* reticle + hitmarker + on-beat tick */
#hud-ret{position:absolute;left:50%;top:50%;width:0;height:0}
#hud-ret .ret-dot{position:absolute;left:-2px;top:-2px;width:4px;height:4px;border-radius:50%;background:#fff;opacity:.7;box-shadow:0 0 6px #000}
#hud-ret .ret-ring{position:absolute;left:-13px;top:-13px;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--cyan);opacity:0;will-change:transform,opacity}
#hud-ret .ret-hit{position:absolute;left:-14px;top:-14px;width:28px;height:28px;opacity:0;--c:#fff;
  background:linear-gradient(45deg,transparent 46%,var(--c) 46% 54%,transparent 54%),linear-gradient(-45deg,transparent 46%,var(--c) 46% 54%,transparent 54%);
  -webkit-mask:radial-gradient(circle,transparent 5px,#000 6px);mask:radial-gradient(circle,transparent 5px,#000 6px)}
#hud-ret .ret-hit.go{animation:hitMark .22s ease-out}
#hud-ret .ret-hit.beat{--c:var(--gold)}
#hud-ret .ret-hit.kill{--c:var(--mag)}
@keyframes hitMark{0%{opacity:1;transform:scale(1.5)}100%{opacity:0;transform:scale(.9)}}
#hud-onbeat{position:absolute;left:50%;top:calc(50% + 46px);transform:translateX(-50%);font:700 13px/1 var(--f);letter-spacing:.4em;text-indent:.4em;color:var(--gold);text-shadow:0 0 12px #ffd166aa,0 1px 4px #000;opacity:0;white-space:nowrap}
#hud-onbeat.go{animation:onBeat .55s ease-out}
@keyframes onBeat{0%{opacity:1;transform:translateX(-50%) scale(1.35)}25%{opacity:1;transform:translateX(-50%) scale(1)}100%{opacity:0;transform:translateX(-50%) translateY(-8px)}}

/* combo, right */
#hud-combo{position:absolute;right:36px;top:36%;text-align:right;opacity:0;transition:opacity .3s;text-shadow:0 2px 10px #000}
#hud-combo.on{opacity:1}
#hud-combo .cb-n{display:inline-block;font:700 58px/.9 var(--f);color:#fff;font-style:italic;transform-origin:100% 80%}
#hud-combo .cb-n.bump{animation:cbBump .16s ease-out}
@keyframes cbBump{0%{transform:scale(1.35);color:var(--cyan)}}
#hud-combo .cb-l{font:700 11px/1 var(--f);letter-spacing:.42em;color:var(--cyan);margin-top:6px}
#hud-combo .cb-s{font:700 11px/1 var(--f);letter-spacing:.2em;color:var(--gold);margin-top:8px;min-height:11px}
#hud-combo .cb-bar{height:2px;margin-top:8px;background:var(--cyan);transform-origin:100% 50%;will-change:transform}

/* damage direction + screen hurt */
#hud-dmg{position:absolute;left:50%;top:50%;width:0;height:0}
.dmg-arc{position:absolute;left:-150px;top:-150px;width:300px;height:300px;opacity:0;will-change:transform,opacity;
  background:conic-gradient(from -24deg,transparent 0,var(--mag) 24deg,transparent 48deg);
  -webkit-mask:radial-gradient(circle,transparent 126px,#000 129px,#000 140px,transparent 150px);mask:radial-gradient(circle,transparent 126px,#000 129px,#000 140px,transparent 150px)}
#hud-hurt{position:absolute;inset:0;opacity:0;background:radial-gradient(ellipse at center,transparent 45%,rgba(255,61,138,.42) 100%);will-change:opacity}

/* world-space markers: enemy pips, warnings, floating damage */
.pip{position:absolute;left:0;top:0;width:46px;height:5px;margin:-3px 0 0 -23px;background:rgba(6,10,18,.8);border:1px solid #ff3d8a66;opacity:0;will-change:transform,opacity}
.pip i{display:block;height:100%;background:var(--mag);transform-origin:0 50%;will-change:transform}
.pip.duck{border-color:var(--gold)}.pip.duck i{background:var(--gold)}
.dnum{position:absolute;left:0;top:0;font:700 16px/1 var(--f);color:#fff;text-shadow:0 0 6px #000,0 1px 2px #000;opacity:0;will-change:transform,opacity;white-space:nowrap;font-style:italic}
.dnum.beat{color:var(--gold);font-size:21px}
.warn{position:absolute;left:0;top:0;width:28px;height:28px;margin:-14px 0 0 -14px;opacity:0;will-change:transform,opacity;display:flex;align-items:center;justify-content:center;font:700 17px/1 var(--f);color:var(--gold);text-shadow:0 0 6px #000}
.warn::before{content:"";position:absolute;inset:2px;border:2px solid var(--gold);background:rgba(20,14,0,.65);box-shadow:0 0 12px #ffd16688;transform:rotate(45deg);z-index:-1}

/* boss */
#hud-boss{position:absolute;top:24px;left:50%;transform:translateX(-50%);width:min(560px,60vw);text-align:center}
#hud-boss .boss-label{font:700 12px/1 var(--f);letter-spacing:.5em;text-indent:.5em;color:var(--mag);margin-bottom:8px;text-shadow:0 1px 6px #000}
#hud-boss .boss-track{position:relative;height:10px;background:rgba(10,6,12,.8);border:1px solid rgba(255,61,138,.45);transform:skewX(-14deg);overflow:hidden}
#hud-boss .boss-fill{position:absolute;inset:0;background:linear-gradient(90deg,#8a1038,var(--mag));box-shadow:0 0 12px #ff3d8a88;transform-origin:0 50%;transition:transform .15s linear}
#hud-boss .boss-track::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent 33.1%,#000a 33.1% 33.5%,transparent 33.5% 66.4%,#000a 66.4% 66.8%,transparent 66.8%)}
#hud-boss .boss-weak{margin-top:9px;font:700 15px/1 var(--f);letter-spacing:.5em;text-indent:.5em;color:var(--gold);opacity:0;text-shadow:0 0 14px #ffd166}
#hud-boss.weak .boss-weak{opacity:1;animation:bossWeakFlash .17s linear alternate infinite}
#hud-boss.weak .boss-track{border-color:var(--gold);box-shadow:0 0 16px #ffd16688}
@keyframes bossWeakFlash{from{opacity:.55}to{opacity:1}}

/* subtitles, prompts, tips */
#hud-callout{position:absolute;left:50%;bottom:150px;transform:translateX(-50%);max-width:640px;text-align:center;font:600 16px/1.35 var(--f);color:#fff;background:rgba(4,8,14,.6);padding:6px 16px;letter-spacing:.02em;text-shadow:0 1px 3px #000}
#prompt{position:absolute;left:50%;top:60%;transform:translateX(-50%);display:none;font:700 13px var(--f);background:var(--panel);padding:8px 16px;border:1px solid var(--line);letter-spacing:.2em;color:var(--cyan);text-shadow:0 0 8px #3df0ff66;white-space:nowrap;text-transform:uppercase}
#hud-tip{position:absolute;left:50%;bottom:104px;transform:translateX(-50%);font:600 14px/1.3 var(--f);letter-spacing:.03em;color:var(--txt);background:var(--panel);padding:9px 18px;border-bottom:2px solid var(--cyan);white-space:nowrap;transition:opacity .35s,transform .35s;text-shadow:0 1px 4px #000}
#hud-tip.off{opacity:0;transform:translateX(-50%) translateY(8px)}
#hud-tip.done{border-color:var(--gold);color:var(--gold)}

/* ---------- screens ---------- */
#fade{position:fixed;inset:0;z-index:15;background:#03050a;opacity:0;pointer-events:none;transition:opacity .5s}
#fade.on{opacity:1;transition:none}
.overlay{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;pointer-events:auto}
.btn{pointer-events:auto;cursor:pointer;border:1px solid var(--cyan);background:rgba(61,240,255,.08);color:var(--cyan);font:700 14px var(--f);letter-spacing:.3em;text-indent:.3em;padding:13px 30px;min-width:260px;transform:skewX(-8deg);transition:background .12s,color .12s,box-shadow .12s}
.btn>span{display:inline-block;transform:skewX(8deg);pointer-events:none}
.btn:hover,.btn:focus-visible{background:var(--cyan);color:#041018;box-shadow:0 0 26px #3df0ff88;outline:none}
.btn.primary{background:var(--cyan);color:#041018;box-shadow:0 0 22px #3df0ff55}
.btn.primary:hover{filter:brightness(1.15)}
.btn.ghost{border-color:var(--line);color:var(--txt);background:transparent}
.btn-col{display:flex;flex-direction:column;gap:12px;align-items:center}

/* title */
#start{background:linear-gradient(180deg,rgba(3,6,12,.86) 0%,rgba(3,6,12,.38) 45%,rgba(3,6,12,.92) 100%);flex-direction:column;justify-content:space-between;padding:9vh 24px 6vh;cursor:pointer}
#start::before{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,transparent 0 3px,rgba(61,240,255,.025) 3px 4px)}
#start .t-top{text-align:center}
#start .t-pre{font:700 12px/1 var(--f);letter-spacing:.7em;text-indent:.7em;color:var(--mag);margin-bottom:18px}
#start h1{margin:0;font:700 clamp(54px,9vw,118px)/.9 var(--f);letter-spacing:.2em;text-indent:.2em;color:#fff;text-shadow:0 0 40px #3df0ff66,3px 0 0 #ff3d8a55,-3px 0 0 #3df0ff55}
#start .sub{color:var(--cyan);font:700 15px var(--f);letter-spacing:.82em;text-indent:.82em;margin-top:22px;text-transform:uppercase}
#start .t-tag{color:var(--txt);opacity:.75;font:500 15px/1.5 var(--f);margin:26px auto 0;max-width:520px;letter-spacing:.02em}
#start .t-bottom{display:flex;flex-direction:column;align-items:center;gap:26px}
#start .t-controls{display:grid;grid-template-columns:repeat(4,auto);gap:9px 26px;font:500 12px/1.5 var(--f);color:var(--dim);letter-spacing:.04em}
#start .t-controls span{white-space:nowrap}
#start .t-hint{font:500 10px var(--f);letter-spacing:.2em;color:var(--dim);opacity:.6}
#bStart{animation:startPulse .69s ease-in-out infinite alternate}
@keyframes startPulse{to{box-shadow:0 0 34px #3df0ffaa}}

/* pause / death / victory share the panel look */
.screen{background:rgba(3,6,12,.5);backdrop-filter:blur(7px);animation:screenIn .25s ease-out}
@keyframes screenIn{from{opacity:0}}
.panel{text-align:center;min-width:340px}
.panel .p-pre{text-transform:uppercase;font:700 11px/1 var(--f);letter-spacing:.6em;text-indent:.6em;color:var(--mag);margin-bottom:14px}
.panel h2{margin:0 0 34px;font:700 54px/1 var(--f);letter-spacing:.3em;text-indent:.3em;color:#fff;text-shadow:0 0 28px #3df0ff66;white-space:nowrap}
.panel .p-list{display:grid;grid-template-columns:auto auto;gap:9px 22px;justify-content:center;text-align:left;font:500 13px/1.5 var(--f);color:var(--txt);margin-bottom:28px}
.panel .p-list span:nth-child(odd){text-align:right}
#death{background:radial-gradient(ellipse at center,rgba(40,0,14,.55),rgba(3,2,6,.92));pointer-events:none;animation:deathIn 1.5s ease-out both}
@keyframes deathIn{0%,38%{opacity:0}100%{opacity:1}}
#death .p-bar i{animation-delay:.4s!important}
#death h2{color:var(--mag);margin-bottom:16px;text-shadow:3px 0 0 #3df0ff66,-3px 0 0 #ff3d8a,0 0 30px #ff3d8a88;animation:glitch 1.4s steps(2) infinite}
#death .p-sub{font:500 13px var(--f);letter-spacing:.24em;color:var(--dim)}
#death .p-bar{width:260px;height:2px;margin:22px auto 0;background:#ffffff18;overflow:hidden}
#death .p-bar i{display:block;height:100%;background:var(--cyan);transform-origin:0 50%;animation:resync 2s linear forwards}
@keyframes resync{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes glitch{0%,92%{transform:none}94%{transform:translateX(-6px) skewX(8deg)}97%{transform:translateX(5px)}}
#victory{background:linear-gradient(180deg,rgba(3,6,12,.92),rgba(3,10,16,.84));animation:screenIn 1.2s ease-out}
#victory h2{color:var(--cyan);margin-bottom:14px}
#victory .p-sub{font:500 14px var(--f);letter-spacing:.2em;color:var(--txt);margin-bottom:34px}
#victory .v-stats{display:grid;grid-template-columns:repeat(5,1fr);margin:0 auto 34px;max-width:860px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
#victory .v-stat{padding:18px 14px}
#victory .v-stat+.v-stat{border-left:1px solid var(--line)}
#victory .v-stat b{display:block;font:700 34px/1 var(--f);color:#fff;font-style:italic}
#victory .v-stat span{display:block;margin-top:9px;font:700 9px/1.2 var(--f);letter-spacing:.24em;color:var(--cyan)}
#victory .v-ct{font:700 10px var(--f);letter-spacing:.5em;text-indent:.5em;color:var(--mag);margin-top:34px}
#victory .v-credits{margin:12px auto 0;font:500 12px/1.9 var(--f);color:var(--txt);letter-spacing:.06em;display:grid;grid-template-columns:1fr 1fr;gap:0 18px;max-width:420px;text-align:left}
#victory .v-credits span:nth-child(odd){text-align:right;color:var(--dim);letter-spacing:.16em;font-size:10px;text-transform:uppercase}
@media (max-height:700px){.pw{width:46px;height:46px}.pw svg{left:9px;top:5px}#start .t-controls{grid-template-columns:repeat(3,auto)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important}}
</style>
<script>
(function(){
  var CDNS=[['unpkg','https://unpkg.com/three@0.164.1/'],['jsdelivr','https://cdn.jsdelivr.net/npm/three@0.164.1/']];
  var q=location.search.match(/[?&]cdn=(\d)/),ci=q?Math.min(+q[1],CDNS.length-1):0,cdn=CDNS[ci];
  window.AG_CDN={i:ci,name:cdn[0],base:cdn[1]};
  var im=document.createElement('script');im.type='importmap';
  im.textContent=JSON.stringify({imports:{
    'three':cdn[1]+'build/three.module.js',
    'three/addons/':cdn[1]+'examples/jsm/',
    'recast-navigation':'https://cdn.jsdelivr.net/npm/recast-navigation@0.43.1/index.mjs',
    '@recast-navigation/core':'https://cdn.jsdelivr.net/npm/@recast-navigation/core@0.43.1/dist/index.mjs',
    '@recast-navigation/generators':'https://cdn.jsdelivr.net/npm/@recast-navigation/generators@0.43.1/dist/index.mjs',
    '@recast-navigation/three':'https://cdn.jsdelivr.net/npm/@recast-navigation/three@0.43.1/dist/index.mjs',
    '@recast-navigation/wasm':'https://cdn.jsdelivr.net/npm/@recast-navigation/wasm@0.43.1/dist/recast-navigation.wasm-compat.js'
  }});
  document.currentScript.after(im);
  window.addEventListener('error',function(e){
    if(e&&e.target&&e.target!==window){return;}
    var d=document.getElementById('err'); if(!d)return;
    d.style.display='block';
    d.textContent=(d.textContent?d.textContent+'\n':'')+(e.message||e)+' '+(e.filename||'')+':'+(e.lineno||'');
  },true);
  window.addEventListener('unhandledrejection',function(e){
    var r=e.reason; if(r&&(r.name==='NotAllowedError'||r.name==='AbortError'))return;
    var d=document.getElementById('err'); if(!d)return;
    d.style.display='block'; d.textContent='Unhandled: '+(r&&r.message||r);
  });
  var failed=false;
  function bootFail(){
    if(window.__AG_BOOTED||failed)return; failed=true;
    if(ci+1<CDNS.length&&!/[?&]cdn=/.test(location.search)){
      var sp=new URLSearchParams(location.search); sp.set('cdn',String(ci+1));
      location.replace(location.pathname+'?'+sp.toString()+location.hash); return;
    }
    var d=document.getElementById('err'); if(d){d.style.display='block'; d.textContent='The game did not start. Allow unpkg or jsDelivr and reload.';}
  }
  window.addEventListener('load',function(){setTimeout(bootFail,20000);});
})();
</script>
</head>

  <div id="prompt"></div>
</div>

  <div class="t-top">
    <div class="t-pre">PROJECT</div>
    <h1>AEGIS</h1>
    <div class="sub" id="subtitle-text">ECHOES OF THE GRID</div>
    <p class="t-tag" id="title-tag"></p>
    <p id="title-text" class="hidden"></p>
  </div>
  <div class="t-bottom">
    <button class="btn primary" id="bStart" type="button"><span>START</span></button>
    <div class="t-controls" id="title-controls"></div>
  </div>
</div>
<div id="err"></div>
<script type="module" src="./src/main.js"></script>
